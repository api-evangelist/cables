name: Cables
description: An agent-native, pay-per-call MCP resource server exposing 168 TensorFlow.js machine-learning
  analytics tools (image classification, object detection, NLP, forecasting, and social-media analytics
  for YouTube, Instagram, TikTok, Twitter/X, Facebook, Discord, and Twitch). Each tool call is monetized
  via the x402 payment protocol at $0.05 per call, settled in USDC on Solana devnet. Unpaid requests receive
  an HTTP 402 challenge.
